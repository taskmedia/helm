name: Lint and Test Charts

on:
  pull_request:

  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.10.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch main)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          ct lint \
            --check-version-increment=false \
            --target-branch main

      - name: Add chart repositories
        if: steps.list-changed.outputs.changed == 'true'
        run: helm repo add taskmedia https://helm.task.media

      - name: Create kind cluster
        uses: helm/kind-action@v1.13.0
        if: steps.list-changed.outputs.changed == 'true'

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        # paperlessngx-ftp-bridge is excluded: its app image does a one-shot
        # FTP connectivity check at startup and exits if it can't connect,
        # which it never can from the CI sandbox. Safe to skip for now since
        # that app is being rewritten without an FTP dependency; re-include
        # once the rewrite lands.
        run: ct install --all --chart-dirs charts --excluded-charts paperlessngx-ftp-bridge
