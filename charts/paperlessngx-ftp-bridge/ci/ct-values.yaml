# Minimal overrides so `ct lint` can render this chart's templates (the
# `required` checks). The chart is excluded from `ct install` (see
# .github/workflows/test.yaml).
#
# paperless.url points at the bridge's own health-check server rather than a
# real paperless-ngx: the bridge's Ping() treats any HTTP response as
# reachable, so this keeps /readyz non-flaky without a second service.
ftp:
  accounts:
    - username: ctuser
      password: ct-test-password
  # ftpserverlib requires a real IP here, not a hostname.
  pasv:
    publicHost: 127.0.0.1

paperless:
  url: "http://localhost:8080"
  username: ctuser
  password: ct-test-password
