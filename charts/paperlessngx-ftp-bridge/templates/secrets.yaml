{{- $data := dict }}
{{- range $i, $account := .Values.ftp.accounts }}
{{- $existingSecret := $account.passwordExistingSecret | default dict }}
{{- if and $account.password (not $existingSecret.name) }}
{{- $_ := set $data (printf "ftp-account-%d-password" $i) $account.password }}
{{- end }}
{{- end }}
{{- if and .Values.paperless.password (not .Values.paperless.passwordExistingSecret.name) }}
{{- $_ := set $data "paperless-password" .Values.paperless.password }}
{{- end }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "plngxftpbridge.fullname" . }}"
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
