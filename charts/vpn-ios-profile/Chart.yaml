apiVersion: v2
name: vpn-ios-profile
description: Deploy a VPN server in K8s with provided iOS profile
home: https://helm.task.media/vpn-ios-profile/
keywords:
- vpn
- ipsec
- ios
- mobileconfig

maintainers:
- name: taskmedia
  url: https://task.media
sources:
- https://github.com/taskmedia/helm

type: application

version: 0.3.2

appVersion: "latest"

dependencies:
- alias: vpnserver
  name: ipsec-vpn-server
  version: 2.2.0
  repository: "https://helm.task.media/"

icon: https://media.task.media/images/logo.png

annotations:
  artifacthub.io/category: networking
  artifacthub.io/links: |
    - name: support
      url: https://github.com/taskmedia/helm/issues
    - name: source
      url: https://github.com/taskmedia/helm/tree/main/charts/vpn-ios-profile
  artifacthub.io/images: |
    - name: nginx
      image: nginxinc/nginx-unprivileged
  artifacthub.io/changes: |
    - kind: changed
      description: Add Artifact Hub metadata (category, links, images)
