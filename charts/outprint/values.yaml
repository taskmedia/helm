# Outprint chart (https://github.com/taskmedia/outprint, docs: Deploy > Helm and Kubernetes). Gateway, Worker and injector
# from the two release images. The Worker keeps the baseline of ADR 0001
# (https://github.com/taskmedia/outprint/blob/main/docs/adr/0001-split-renderer-into-gateway-and-worker.md):
# non-root, read-only root file system, no network, no secrets but an
# optional shared token, resource limits.

# Your self-hosted Outline. Required.
outline:
  # Base URL of Outline as the Gateway reaches it (an in-cluster address is fine).
  url: ""
  # Outline's own URL setting, when `url` is an internal address.
  # See "Image fetching" in the outprint docs. Empty = not set.
  publicUrl: ""

image:
  repository: ghcr.io/taskmedia/outprint
  # Empty = the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Service configuration (config/service.yaml in the image): the allow-list of
# Bindings and the default Binding. The Template and Configuration roots point
# at the packages baked into the image. To ship your own packages, build an
# image on top of the release image and set image.repository / image.tag.
serviceConfig:
  templatesRoot: /opt/outprint/templates
  configurationsRoot: /opt/outprint/configurations
  bindings:
    - template: neutral
      configuration: example
  defaultBinding:
    template: neutral
    configuration: example
  # imageHosts: []
  # Admission control. The number of slots follows worker.replicas.
  admission:
    queueDepth: 4
    perUser: 1
    maxWait: 60s

# Bearer token shared by Gateway and Worker; the one secret the Worker may
# hold. Use existingSecret (key: token) to bring your own; otherwise the chart
# creates a Secret with a random token and keeps it across upgrades.
# Set enabled: false for no token.
workerToken:
  enabled: true
  existingSecret: ""

# Your own Template and Configuration packages (docs: Install > Run Outprint >
# Your own Templates and Configurations). Set at most one source. Without one,
# the packages baked into the image (neutral, example) are used.
#
# Gateway and Worker mount the packages read-only at /packages and read them
# through OUTPRINT_TEMPLATES_ROOT / OUTPRINT_CONFIGURATIONS_ROOT. Allow the
# pairs you want in serviceConfig.bindings.
packages:
  # Packages in Git repositories. A CronJob (and a Job on install and on a
  # change of the sources) resolves each `ref` to a commit; on a change it
  # clones the commits (Git LFS included), merges their packages into one
  # revision, runs `outprint validate`, switches over only if the check passes,
  # then restarts Gateway and Worker. Only this Job has network; the Worker
  # keeps its NetworkPolicy.
  #
  # `git` below is the shorthand for one repository. For more than one, list
  # them under `sources` (see there). The settings `interval`, `image`,
  # `resources`, `persistence` and `keepRevisions` of `git` apply to all sources.
  git:
    # SSH or HTTPS URL. Empty = off.
    url: ""
    # Tag, branch or commit.
    ref: main
    # Optional integrity check: refuse any other commit (full or abbreviated SHA).
    commit: ""
    # Folder in the repository that holds templates/ and configurations/.
    path: ""
    # Secret with key `ssh-privatekey` (and optionally `known_hosts`) for a
    # private repository. Empty = anonymous HTTPS.
    sshKeySecret: ""
    # How often the CronJob checks `ref`.
    interval: 5m
    # Needs git, git-lfs (installed at run time), ssh and kubectl.
    image:
      repository: alpine/k8s
      tag: "1.33.4"
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
    persistence:
      # Holds the checked out revisions. ReadWriteOnce: Gateway, Worker and the
      # Job must run on the same node (single node clusters need nothing).
      size: 100Mi
      storageClass: ""
      accessMode: ReadWriteOnce
    # Keep this many old revisions besides the active one.
    keepRevisions: 2
  # Several Git repositories. The shorthand `git` above, if its `url` is set,
  # counts as a source named `default`. Each source brings Template and
  # Configuration packages (folders `templates/<name>` and
  # `configurations/<name>`, at least one of the two). A package name must be
  # unique across all sources; a clash stops the sync and keeps the running
  # revision. Names of sources: lower case letters, digits and `-`.
  #
  # sources:
  #   - name: letters
  #     git:
  #       url: git@github.com:example/letters.git
  #       ref: v1.0.0
  #       path: outprint
  #       sshKeySecret: letters-deploy-key
  #   - name: reports
  #     git:
  #       url: https://github.com/example/reports.git
  #       ref: main
  sources: []
  # Packages in an OCI image (Kubernetes image volume, Kubernetes 1.35+ or the
  # ImageVolume feature gate). The image holds templates/ and configurations/.
  image:
    reference: ""
    pullPolicy: IfNotPresent
  # An existing PersistentVolumeClaim that holds templates/ and configurations/.
  existingClaim: ""
  # Folder inside the image or claim that holds templates/ and configurations/.
  path: ""

worker:
  # One job per replica. Throughput scales with replicas.
  replicas: 1
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  # Job directories (OUTPRINT_WORK_DIR) and scratch space; in memory, gone
  # with the pod. Memory-backed volumes count against the memory limit.
  workDirSize: 256Mi
  tmpSize: 64Mi
  # Extra environment, for example OUTPRINT_TIMEOUT, OUTPRINT_MAX_PAGES.
  env: {}
  extraVolumes: []
  extraVolumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # Default-deny egress, ingress only from the Gateway. Needs a CNI that
  # enforces NetworkPolicy. Turning this off weakens the Worker baseline.
  networkPolicy:
    enabled: true

gateway:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 256Mi}
  # Extra environment, for example the OUTPRINT_BUTTON_* placement options.
  env: {}
  extraVolumes: []
  extraVolumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The injector sits between your edge proxy and Outline (Export menu way).
# Disable it for the PDF by link way.
injector:
  enabled: true
  image:
    repository: ghcr.io/taskmedia/outprint-injector
    tag: ""
    pullPolicy: IfNotPresent
  # Where the injector reaches Outline. Empty = outline.url.
  upstream: ""
  cspAllowSelf: false
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 128Mi}
  env: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 80
  # Optional. Many clusters route in their own way; then point your edge
  # at the injector Service instead.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []   # for example [wiki.example.test]
    tls: []

# Optional Traefik IngressRoute (CRD) for the injector. The whole host goes to
# the injector, which forwards /pdf/* to the Gateway and everything else to
# Outline, so no prefix middleware is needed. Needs injector.enabled. Use
# either this or injector.ingress, not both.
ingressRoute:
  enabled: false
  annotations: {}
  entryPoints:
    - websecure
  host: ""
  # Set it higher than the priority of any other router for the same host,
  # for example Outline's own Ingress. Empty = Traefik's default.
  priority: ""
  # middlewares is a list of Traefik middleware references (name, optional namespace)
  middlewares: []
  tls:
    # secretName enables TLS for ingressRoute.host
    secretName: ""
    # certificate creates a cert-manager Certificate for ingressRoute.host
    # stored in tls.secretName
    certificate:
      enabled: false
      issuerRef:
        name: ""
        kind: ClusterIssuer
        group: cert-manager.io
