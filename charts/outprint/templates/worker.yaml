{{- $name := printf "%s-worker" (include "outprint.fullname" .) -}}
{{- $sel := include "outprint.selector" (dict "root" . "component" "worker") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "outprint.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "outprint.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/service-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The Worker needs no Kubernetes API, no token and no service links.
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "outprint.podSecurity" (dict "uid" 10001) | nindent 8 }}
        fsGroup: 10001
      containers:
        - name: worker
          image: {{ include "outprint.image" (dict "repository" .Values.image.repository "tag" .Values.image.tag "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          securityContext:
            {{- include "outprint.containerSecurity" . | nindent 12 }}
          env:
            - name: OUTPRINT_LISTEN
              value: ":8081"
            - name: OUTPRINT_WORK_DIR
              value: /work
            - name: OUTPRINT_SERVICE_CONFIG
              value: /etc/outprint/service.yaml
            {{- include "outprint.tokenEnv" . | nindent 12 }}
            {{- include "outprint.extraEnv" .Values.worker.env | nindent 12 }}
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
            - { name: service-config, mountPath: /etc/outprint, readOnly: true }
      volumes:
        - name: work
          emptyDir: { medium: Memory, sizeLimit: {{ .Values.worker.workDirSize }} }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: {{ .Values.worker.tmpSize }} }
        - name: service-config
          configMap:
            name: {{ include "outprint.fullname" . }}-service
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "outprint.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    {{- $sel | nindent 4 }}
  ports:
    - name: http
      port: 8081
      targetPort: http
{{- if .Values.worker.networkPolicy.enabled }}
---
# Egress is empty on purpose: the Worker has no route to the internet, to
# Outline, to DNS or to the cluster. Ingress only from the Gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "outprint.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  podSelector:
    matchLabels:
      {{- $sel | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "outprint.selector" (dict "root" . "component" "gateway") | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8081 }
  egress: []
{{- end }}
