{{- $name := printf "%s-gateway" (include "outprint.fullname" .) -}}
{{- $sel := include "outprint.selector" (dict "root" . "component" "gateway") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "outprint.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "outprint.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/service-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "outprint.podSecurity" (dict "uid" 10001) | nindent 8 }}
      {{- include "outprint.packagesWait" . | nindent 6 }}
      containers:
        - name: gateway
          image: {{ include "outprint.image" (dict "repository" .Values.image.repository "tag" .Values.image.tag "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["gateway"]
          securityContext:
            {{- include "outprint.containerSecurity" . | nindent 12 }}
          env:
            - name: OUTPRINT_LISTEN
              value: ":8080"
            - name: OUTPRINT_WORKER_URL
              value: {{ printf "http://%s-worker:8081" (include "outprint.fullname" .) | quote }}
            - name: OUTPRINT_SERVICE_CONFIG
              value: /etc/outprint/service.yaml
            - name: OUTLINE_URL
              value: {{ required "outline.url is required: the base URL of your Outline" .Values.outline.url | quote }}
            {{- with .Values.outline.publicUrl }}
            - name: OUTLINE_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- include "outprint.tokenEnv" . | nindent 12 }}
            {{- include "outprint.packagesEnv" . | nindent 12 }}
            {{- include "outprint.extraEnv" .Values.gateway.env | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - { name: service-config, mountPath: /etc/outprint, readOnly: true }
            {{- include "outprint.packagesVolumeMount" . | nindent 12 }}
            {{- with .Values.gateway.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: service-config
          configMap:
            name: {{ include "outprint.fullname" . }}-service
        {{- include "outprint.packagesVolume" . | nindent 8 }}
        {{- with .Values.gateway.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "outprint.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    {{- $sel | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
