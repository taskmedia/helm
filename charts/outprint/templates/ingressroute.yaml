{{- if .Values.ingressRoute.enabled }}
{{- $host := required "ingressRoute.host is required" .Values.ingressRoute.host }}
{{- if not .Values.injector.enabled }}
{{- fail "ingressRoute.enabled needs injector.enabled: the IngressRoute sends the whole host to the injector, which forwards /pdf/* to the Gateway" }}
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "outprint.fullname" . }}-injector"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "outprint.labels" . | nindent 4 }}
  {{- with .Values.ingressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ $host }}`)
      kind: Rule
      {{- with .Values.ingressRoute.priority }}
      priority: {{ . }}
      {{- end }}
      {{- with .Values.ingressRoute.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: "{{ include "outprint.fullname" . }}-injector"
          port: {{ .Values.injector.service.port }}
  {{- with .Values.ingressRoute.tls.secretName }}
  tls:
    secretName: {{ . }}
  {{- end }}
{{- end }}
