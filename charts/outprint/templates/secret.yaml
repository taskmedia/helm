{{- if and .Values.workerToken.enabled (not .Values.workerToken.existingSecret) }}
{{- $name := printf "%s-worker-token" (include "outprint.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "outprint.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ if $existing }}{{ index $existing.data "token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
