{{- $secretName := include "paperlessgpt.fullname" . }}
{{- $tokenSecret := .Values.paperless.apiTokenExistingSecret | default dict }}
{{- if not (or .Values.paperless.apiToken $tokenSecret.name) }}
{{- fail "paperless.apiToken or paperless.apiTokenExistingSecret.name is required" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "paperlessgpt.fullname" . }}"
  labels:
    {{- include "paperlessgpt.labels" . | nindent 4 }}
spec:
  # Hardcoded, not a .Values knob: state lives in a local SQLite database on a
  # single volume, so only one instance may run, and never two during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "paperlessgpt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        secret-hash: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        config-hash: {{ toYaml .Values.config | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "paperlessgpt.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: paperless-gpt
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          env:
            - name: PAPERLESS_BASE_URL
              value: {{ .Values.paperless.baseUrl | quote }}
            {{- with .Values.paperless.publicUrl }}
            - name: PAPERLESS_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            - name: PAPERLESS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default $secretName $tokenSecret.name }}
                  key: {{ default "paperless-api-token" $tokenSecret.key }}
            {{- range $key, $value := .Values.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key := keys .Values.secretConfig | sortAlpha }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # no documented health endpoint upstream: probe the listening port
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /app/prompts
              subPath: prompts
            - name: data
              mountPath: /app/config
              subPath: config
            - name: data
              mountPath: /app/db
              subPath: db
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- if or .Values.persistence.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (include "paperlessgpt.fullname" .) .Values.persistence.existingClaim }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
