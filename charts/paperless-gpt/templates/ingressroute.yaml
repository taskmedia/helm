{{- if .Values.ingressRoute.enabled }}
{{- $host := required "ingressRoute.host is required" .Values.ingressRoute.host }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: "{{ include "paperlessgpt.fullname" . }}"
  labels:
    {{- include "paperlessgpt.labels" . | nindent 4 }}
  {{- with .Values.ingressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ $host }}`)
      kind: Rule
      {{- with .Values.ingressRoute.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: "{{ include "paperlessgpt.fullname" . }}"
          port: {{ .Values.service.port }}
  {{- with .Values.ingressRoute.tls.secretName }}
  tls:
    secretName: {{ . }}
  {{- end }}
{{- end }}
