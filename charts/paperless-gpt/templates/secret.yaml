{{- if or .Values.paperless.apiToken .Values.secretConfig }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "paperlessgpt.fullname" . }}"
  labels:
    {{- include "paperlessgpt.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.paperless.apiToken }}
  paperless-api-token: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secretConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
