# image used for paperless-gpt (official upstream image)
image:
  repository: icereed/paperless-gpt
  # tag defaults to v<appVersion>
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# paperless-ngx instance to connect to
paperless:
  # url with protocol but no API endpoint
  baseUrl: "http://paperless-ngx:8000"
  # publicUrl is used for links in the UI (optional)
  publicUrl: ""
  # apiToken for paperless-ngx
  apiToken: ""
  # apiTokenExistingSecret is used to reference an existing secret in the same namespace
  apiTokenExistingSecret:
    name: ""
    key: ""

# config contains plain environment variables, see
# https://github.com/icereed/paperless-gpt#configuration
# Example (OpenAI):
#   LLM_PROVIDER: openai
#   LLM_MODEL: gpt-4o
# Example (Ollama):
#   LLM_PROVIDER: ollama
#   LLM_MODEL: qwen3:8b
#   OLLAMA_HOST: http://ollama:11434
#   OCR_PROVIDER: llm
#   VISION_LLM_PROVIDER: ollama
#   VISION_LLM_MODEL: minicpm-v
config: {}

# secretConfig contains sensitive environment variables (e.g. OPENAI_API_KEY)
# stored in a secret created by this chart
secretConfig: {}

# existingSecret references a secret in the same namespace whose keys are all
# injected as environment variables (e.g. OPENAI_API_KEY, ANTHROPIC_API_KEY)
existingSecret: ""

# extraEnv allows additional env entries (e.g. valueFrom references)
extraEnv: []

# persistence for prompts, UI settings and history (undo, OCR run log)
# Without it all of these are lost when the pod is recreated.
persistence:
  enabled: true
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

# extraVolumes and extraVolumeMounts can be used e.g. for hOCR/PDF output or
# a Google Document AI credentials file
extraVolumes: []
extraVolumeMounts: []

# paperless-gpt has no built-in authentication: do not expose the service
# without an authenticating proxy in front of it.
service:
  type: ClusterIP
  port: 8080
  annotations: {}

# ingress exposes the service. paperless-gpt has no built-in authentication:
# always add an authenticating proxy (e.g. forward-auth middleware) in front.
# Example (Traefik + cert-manager + authentik):
#   enabled: true
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-prod
#     traefik.ingress.kubernetes.io/router.entrypoints: websecure
#     traefik.ingress.kubernetes.io/router.tls: "true"
#     traefik.ingress.kubernetes.io/router.middlewares: authentik-proxy@kubernetescrd
#   host: gpt.example.com
#   tls:
#     secretName: paperless-gpt-tls
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  path: /
  pathType: Prefix
  tls:
    # secretName enables TLS for ingress.host (certificate e.g. created by cert-manager)
    secretName: ""

# ingressRoute exposes the service via a Traefik IngressRoute CRD (alternative
# to ingress). The IngressRoute cannot trigger cert-manager's ingress-shim, so
# the chart can create the Certificate itself (tls.certificate).
# paperless-gpt has no built-in authentication: add an authenticating
# middleware (e.g. authentik forward-auth).
# Example:
#   enabled: true
#   host: gpt.example.com
#   middlewares:
#     - name: proxy
#       namespace: authentik
#   tls:
#     secretName: paperless-gpt-tls
#     certificate:
#       enabled: true
#       issuerRef:
#         name: letsencrypt-prod
ingressRoute:
  enabled: false
  annotations: {}
  entryPoints:
    - websecure
  host: ""
  # middlewares is a list of Traefik middleware references (name, optional namespace)
  middlewares: []
  tls:
    # secretName enables TLS for ingressRoute.host
    secretName: ""
    # certificate creates a cert-manager Certificate for ingressRoute.host
    # stored in tls.secretName
    certificate:
      enabled: false
      issuerRef:
        name: ""
        kind: ClusterIssuer
        group: cert-manager.io

# runs as non-root; the entrypoint then skips PUID/PGID handling
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}
